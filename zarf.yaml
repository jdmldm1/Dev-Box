kind: ZarfPackageConfig
metadata:
  name: dev-box
  description: "Self-contained airgap developer box with code-server IDE, Go/DotNet/Zarf toolchains"
  version: "1.4.0"
  architecture: amd64

variables:
  - name: CODE_SERVER_PASSWORD
    description: "Password for code-server IDE"
    default: "phalanx-nomad"
    sensitive: true

components:
  - name: dev-box
    description: "Dev-Box code-server deployment, installed with Helm"
    required: true
    charts:
      - name: dev-box
        version: 1.4.0
        namespace: dev-box
        releaseName: dev-box
        localPath: charts/dev-box
        variables:
          - name: CODE_SERVER_PASSWORD
            description: "Password for code-server IDE"
            path: password
    images:
      - airgap-dev:local
    actions:
      onDeploy:
        after:
          - description: Wait for dev-box to become available
            wait:
              cluster:
                kind: Deployment
                name: dev-box
                namespace: dev-box
                condition: Available

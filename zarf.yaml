kind: ZarfPackageConfig
metadata:
  name: dev-box
  description: "Self-contained airgap developer box with code-server IDE, Go/DotNet/Zarf toolchains"
  version: "1.3.3"
  architecture: amd64

variables:
  - name: CODE_SERVER_PASSWORD
    description: "Password for code-server IDE"
    default: "phalanx-nomad"

components:
  - name: dev-box-stack
    description: "Dev-Box container image, compose definition, and offline configuration for the dev-box container"
    required: false
    default: true
    images:
      - airgap-dev:local
    files:
      - source: compose.yml
        target: compose.yml
      - source: .env.example
        target: .env.example
      - source: config
        target: config
      - source: scripts
        target: scripts
      - source: dev
        target: dev
      - source: dev.ps1
        target: dev.ps1

name: Build and package

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
    paths:
      - "docker/**"
      - "compose.yml"
      - "charts/**"
      - "zarf.yaml"
      - ".env.example"
      - ".github/workflows/build-and-package.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "docker/**"
      - "compose.yml"
      - "charts/**"
      - "zarf.yaml"
      - ".env.example"
      - "!**/*.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-and-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Create .env from example
        run: cp .env.example .env

      - name: Load pinned versions
        run: |
          set -a
          source .env.example
          set +a
          {
            echo "GO_VERSION=$GO_VERSION"
            echo "GOPLS_VERSION=$GOPLS_VERSION"
            echo "DELVE_VERSION=$DELVE_VERSION"
            echo "STATICCHECK_VERSION=$STATICCHECK_VERSION"
            echo "GOIMPORTS_VERSION=$GOIMPORTS_VERSION"
            echo "GOFUMPT_VERSION=$GOFUMPT_VERSION"
            echo "DOTNET_VERSION=$DOTNET_VERSION"
            echo "CSHARPLS_VERSION=$CSHARPLS_VERSION"
            echo "ZARF_VERSION=$ZARF_VERSION"
            echo "NODE_MAJOR=$NODE_MAJOR"
            echo "YQ_VERSION=$YQ_VERSION"
            echo "CODE_SERVER_VERSION=$CODE_SERVER_VERSION"
            echo "GOLANG_EXT_VERSION=$GOLANG_EXT_VERSION"
            echo "CSHARP_EXT_VERSION=$CSHARP_EXT_VERSION"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev/Dockerfile
          target: dev
          tags: airgap-dev-dev:local
          load: true
          cache-from: type=gha,scope=devbox-base
          cache-to: type=gha,mode=max,scope=devbox-base
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            GOPLS_VERSION=${{ env.GOPLS_VERSION }}
            DELVE_VERSION=${{ env.DELVE_VERSION }}
            STATICCHECK_VERSION=${{ env.STATICCHECK_VERSION }}
            GOIMPORTS_VERSION=${{ env.GOIMPORTS_VERSION }}
            GOFUMPT_VERSION=${{ env.GOFUMPT_VERSION }}
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}
            CSHARPLS_VERSION=${{ env.CSHARPLS_VERSION }}
            ZARF_VERSION=${{ env.ZARF_VERSION }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
            YQ_VERSION=${{ env.YQ_VERSION }}

      - name: Build code-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev/Dockerfile
          target: code-server
          tags: airgap-dev-code-server:local
          load: true
          cache-from: type=gha,scope=devbox-base
          cache-to: type=gha,mode=max,scope=devbox-base
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            GOPLS_VERSION=${{ env.GOPLS_VERSION }}
            DELVE_VERSION=${{ env.DELVE_VERSION }}
            STATICCHECK_VERSION=${{ env.STATICCHECK_VERSION }}
            GOIMPORTS_VERSION=${{ env.GOIMPORTS_VERSION }}
            GOFUMPT_VERSION=${{ env.GOFUMPT_VERSION }}
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}
            CSHARPLS_VERSION=${{ env.CSHARPLS_VERSION }}
            ZARF_VERSION=${{ env.ZARF_VERSION }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
            YQ_VERSION=${{ env.YQ_VERSION }}
            CODE_SERVER_VERSION=${{ env.CODE_SERVER_VERSION }}
            GOLANG_EXT_VERSION=${{ env.GOLANG_EXT_VERSION }}
            CSHARP_EXT_VERSION=${{ env.CSHARP_EXT_VERSION }}

      - name: Start the stack and wait for health
        run: bash scripts/start.sh

      - name: Verify code-server responds
        run: |
          set -euo pipefail
          source .env
          curl -fsS "http://localhost:${CODE_SERVER_PORT:-8080}/healthz"

      - name: Show status report
        if: always()
        run: bash scripts/status.sh || true

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yml down --volumes

      - name: Install Zarf
        uses: zarf-dev/setup-zarf@main
        with:
          version: v${{ env.ZARF_VERSION }}

      - name: Reclaim build cache before packaging
        run: docker builder prune -af

      - name: Create Zarf package
        run: zarf package create . --confirm --output dist

      - name: Checksum package
        run: |
          (cd dist && sha256sum zarf-package-dev-box-amd64-*.tar.zst > SHA256SUMS)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarf-package-dev-box-amd64
          path: |
            dist/zarf-package-dev-box-amd64-*.tar.zst
            dist/SHA256SUMS
          retention-days: 14

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zarf-package-dev-box-amd64-*.tar.zst
            dist/SHA256SUMS
